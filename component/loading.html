<main class="w-full pt-20 bg-background min-h-[calc(100vh-20rem)]">
    <div class="flex flex-col w-full">
        <section
            class="relative w-full overflow-hidden px-gutter py-space-2xl md:py-space-3xl flex flex-col items-center">
            <!-- Ambient Structural Glow & Circuit Pattern -->
            <div class="absolute inset-0 pointer-events-none flex items-center justify-center opacity-30">
                <div
                    class="w-[800px] h-[800px] rounded-full bg-gradient-to-b from-secondary/10 via-primary-container to-transparent blur-3xl">
                </div>
            </div>
            <!-- Architectural Blueprint Grid Backdrop -->
            <div class="absolute inset-0 pointer-events-none opacity-20">
                <svg class="w-full h-full" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <pattern height="48" id="arch-grid" patternUnits="userSpaceOnUse" width="48">
                            <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#C5C7CA" stroke-dasharray="2 4"
                                stroke-width="0.5"></path>
                        </pattern>
                    </defs>
                    <rect fill="url(#arch-grid)" height="100%" width="100%"></rect>
                </svg>
            </div>
            <div class="relative w-full max-w-7xl mx-auto flex flex-col items-center space-y-space-2xl z-10">
                <div class="card">
                    <div class="loader">
                        <p>loading</p>
                        <div class="words">
                            <span class="word">buttons</span>
                            <span class="word">forms</span>
                            <span class="word">switches</span>
                            <span class="word">cards</span>
                            <span class="word">buttons</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
</main>
